spring.application.name=VirtualCardIssuance
# H2 Database
spring.datasource.url=jdbc:h2:mem:virtualcarddb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable Open Session in View
spring.jpa.open-in-view=false

# Actuator - scoped to what's actually needed, not '*' (which exposed
# /actuator/env, /actuator/heapdump, /actuator/beans publicly).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized